<script>
// Minimal real XLSX (OOXML/ZIP, store method, no compression) generator - no external deps
(function() {
  function crc32(buf) {
    let c, crcTable = window.__crc32Table;
    if (!crcTable) {
      crcTable = [];
      for (let n = 0; n < 256; n++) {
        c = n;
        for (let k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
        crcTable[n] = c;
      }
      window.__crc32Table = crcTable;
    }
    let crc = 0 ^ (-1);
    for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ buf[i]) & 0xFF];
    return (crc ^ (-1)) >>> 0;
  }

  function strToBytes(str) {
    return new TextEncoder().encode(str);
  }

  function u16(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
  function u32(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

  function makeZip(files) {
    // files: [{name, data(Uint8Array)}]
    let localParts = [], centralParts = [], offset = 0;
    files.forEach(f => {
      const nameBytes = strToBytes(f.name);
      const data = f.data;
      const crc = crc32(data);
      const localHeader = [
        0x50,0x4b,0x03,0x04, 20,0, 0,0, 0,0, 0,0,0,0,
        ...u32(crc), ...u32(data.length), ...u32(data.length),
        ...u16(nameBytes.length), ...u16(0)
      ];
      const local = new Uint8Array(localHeader.length + nameBytes.length + data.length);
      local.set(localHeader, 0);
      local.set(nameBytes, localHeader.length);
      local.set(data, localHeader.length + nameBytes.length);
      localParts.push(local);

      const centralHeader = [
        0x50,0x4b,0x01,0x02, 20,0, 20,0, 0,0, 0,0, 0,0,0,0,
        ...u32(crc), ...u32(data.length), ...u32(data.length),
        ...u16(nameBytes.length), ...u16(0), ...u16(0),
        ...u16(0), ...u16(0), ...u32(0), ...u32(offset)
      ];
      const central = new Uint8Array(centralHeader.length + nameBytes.length);
      central.set(centralHeader, 0);
      central.set(nameBytes, centralHeader.length);
      centralParts.push(central);

      offset += local.length;
    });

    const centralStart = offset;
    let centralSize = 0;
    centralParts.forEach(c => centralSize += c.length);

    const eocd = new Uint8Array([
      0x50,0x4b,0x05,0x06, 0,0, 0,0,
      ...u16(files.length), ...u16(files.length),
      ...u32(centralSize), ...u32(centralStart),
      ...u16(0)
    ]);

    const totalSize = offset + centralSize + eocd.length;
    const result = new Uint8Array(totalSize);
    let pos = 0;
    localParts.forEach(p => { result.set(p, pos); pos += p.length; });
    centralParts.forEach(p => { result.set(p, pos); pos += p.length; });
    result.set(eocd, pos);
    return result;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function colName(idx) {
    let s = '';
    idx++;
    while (idx > 0) {
      const m = (idx - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      idx = Math.floor((idx - 1) / 26);
    }
    return s;
  }

  function sheetToXml(sheetData) {
    let rows = '';
    sheetData.data.forEach((row, r) => {
      let cells = '';
      row.forEach((val, c) => {
        const ref = colName(c) + (r + 1);
        if (typeof val === 'number') {
          cells += `<c r="${ref}"><v>${val}</v></c>`;
        } else {
          cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(val == null ? '' : val)}</t></is></c>`;
        }
      });
      rows += `<row r="${r + 1}">${cells}</row>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows}</sheetData></worksheet>`;
  }

  window.XLSX = {
    utils: {
      book_new: () => ({ SheetNames: [], Sheets: {} }),
      aoa_to_sheet: (data) => ({ data }),
      book_append_sheet: (wb, ws, name) => {
        wb.SheetNames.push(name);
        wb.Sheets[name] = ws;
      }
    },
    writeFile: (wb, filename) => {
      const files = [];
      files.push({ name: '[Content_Types].xml', data: strToBytes(
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${wb.SheetNames.map((n, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`
      )});

      files.push({ name: '_rels/.rels', data: strToBytes(
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`
      )});

      files.push({ name: 'xl/workbook.xml', data: strToBytes(
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${wb.SheetNames.map((n, i) => `<sheet name="${esc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`
      )});

      files.push({ name: 'xl/_rels/workbook.xml.rels', data: strToBytes(
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${wb.SheetNames.map((n, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
</Relationships>`
      )});

      wb.SheetNames.forEach((name, i) => {
        files.push({ name: `xl/worksheets/sheet${i+1}.xml`, data: strToBytes(sheetToXml(wb.Sheets[name])) });
      });

      const zipBytes = makeZip(files);
      const blob = new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };
})();

<script>
// Simple PDF export - uses hidden iframe to avoid popup blockers
window.html2pdf = () => {
  let options = {};
  let htmlString = '';
  const api = {
    set: (opts) => {
      options = opts;
      return api;
    },
    fromString: (html) => {
      htmlString = html;
      return api;
    },
    save: () => {
      let iframe = document.getElementById('__pdf-print-frame');
      if (iframe) iframe.remove();
      iframe = document.createElement('iframe');
      iframe.id = '__pdf-print-frame';
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '800px';
      iframe.style.height = '1100px';
      iframe.style.border = '0';
      iframe.style.opacity = '0';
      iframe.style.pointerEvents = 'none';
      iframe.style.zIndex = '-1';
      document.body.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>${options.filename || 'document'}</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: Arial, sans-serif; padding: 20px; color: #333; line-height: 1.6; }
            h1 { font-size: 24px; margin-bottom: 15px; }
            h2 { font-size: 18px; margin-top: 20px; margin-bottom: 10px; color: #555; }
            p { margin: 8px 0; }
            strong { font-weight: bold; }
            @media print {
              body { padding: 10mm; }
            }
          </style>
        </head>
        <body>
          ${htmlString}
        </body>
        </html>
      `);
      doc.close();

      iframe.onload = () => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      };
      // Fallback in case onload doesn't fire (some browsers with document.write)
      setTimeout(() => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        } catch (e) {}
      }, 400);
    }
  };
  return api;
};

</script>

<script>
let data = { asc: '', auditor: '', date: '', line: '', items: {} };
let allControls = [], allAsc = [], allCategories = [], currentCat = 0;

async function fetchJsonSmart(filename) {
  // Intentar datos embebidos primero
  if (filename === 'controls_data.json' && window.__EMBEDDED_CONTROLS__) {
    return window.__EMBEDDED_CONTROLS__;
  }
  if (filename === 'asc_data.json' && window.__EMBEDDED_ASC__) {
    return window.__EMBEDDED_ASC__;
  }
  return [];
}

async function loadControls() {
  try {
    if (window.__EMBEDDED_CONTROLS__?.length > 0) {
      allControls = window.__EMBEDDED_CONTROLS__;
      console.log('✓ Controls loaded from embedded:', allControls.length);
      return;
    }
    allControls = await fetchJsonSmart('controls_data.json');
    console.log('✓ Controls loaded:', allControls.length);
  } catch (e) {
    console.error('Error loading controls:', e);
    allControls = [];
  }
}

async function loadAscData() {
  try {
    if (window.__EMBEDDED_ASC__?.length > 0) {
      allAsc = window.__EMBEDDED_ASC__;
      console.log('✓ ASC data loaded from embedded:', allAsc.length);
      return;
    }
    allAsc = await fetchJsonSmart('asc_data.json');
    console.log('✓ ASC data loaded:', allAsc.length);
  } catch (e) {
    console.error('Error loading ASC data:', e);
    allAsc = [];
  }
}

function selectLine(line, btn) {
  document.querySelectorAll('.btn-inline').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  data.line = line;

  const select = document.getElementById('asc-select');

  if (!allAsc || allAsc.length === 0) {
    select.innerHTML = '<option value="">Cargando ASC...</option>';
    loadAscData().then(() => populateAscSelect(line));
    return;
  }
  populateAscSelect(line);
}

function populateAscSelect(line) {
  const filtered = allAsc.filter(a => {
    if (line === 'MX') {
      return a.linea.includes('MX');
    } else if (line === 'CE') {
      return a.linea.includes('CE') || a.linea.includes('DA') || a.linea.includes('SAC') || a.linea.includes('VD');
    }
    return false;
  });

  const unique = [...new Set(filtered.map(a => a.ascName))].sort();

  const select = document.getElementById('asc-select');
  select.innerHTML = '<option value="">Selecciona un ASC...</option>';
  unique.forEach(name => {
    const opt = document.createElement('option');
    opt.style.color = '#000';
    opt.style.background = '#fff';
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
  const panel = document.getElementById('asc-panel');
  panel.innerHTML = '';
  document.getElementById('asc-label').textContent = 'Selecciona un ASC...';
  unique.forEach(name => {

const STATE_KEY = 'auditState';
let _auditDb = null, storageWarned = false;
function openAuditDb() {
  if (!_auditDb) _auditDb = new Promise((res, rej) => {
    const r = indexedDB.open('auditAppDB', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _auditDb;
}
function kvSet(k, v) {
  return openAuditDb().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
  }));
}
function kvGet(k) {
  return openAuditDb().then(db => new Promise((res, rej) => {
    const r = db.transaction('kv').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function kvDel(k) {
  return openAuditDb().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite');
    t.objectStore('kv').delete(k);
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
  }));
}
function persistState() {
  kvSet(STATE_KEY, { data, allCategories, currentCat }).catch(e => {
    console.warn('No se pudo guardar', e);
    if (!storageWarned) { storageWarned = true; alert('No se pudo guardar el avance en el navegador. Descargue el Excel o PDF para respaldar.'); }
  });
}
function updateObs(cat, idx, value) {
  data.items[cat][idx].observation = value;
  persistState();
}
function removePhoto(cat, idx, pIdx) {
  if (!confirm('¿Eliminar esta evidencia?')) return;
  saveCurrentCategory();
  data.items[cat][idx].photos.splice(pIdx, 1);
  persistState();
  renderCategory(currentCat);
}
function restoreSavedAudit(s) {
  data = s.data;

function discardSavedAudit() {

  const asc = document.getElementById('asc-select').value;

  const date = document.getElementById('audit-date').value;
  const msg = document.getElementById('error-msg');

  if (!asc || !auditor || !date || !data.line || typeof data.ecoRepair !== 'boolean') {
    msg.textContent = '⚠️ Completa todos los campos';
    msg.style.display = 'block';
    return;
  }

  data.asc = asc;
  data.auditor = auditor;
  data.date = date;

  // Filtrar controles por línea
  // ECO Repair solo aplica si el ASC lo tiene activo
  const filtered = allControls.filter(c => c.line === data.line && (data.ecoRepair || c.category !== 'ECO Repair'));
  
  // Agrupar por categoría
  allCategories = [...new Set(filtered.map(c => c.category))].sort();
  data.items = {};

  allCategories.forEach(cat => {
    data.items[cat] = {};

}

function reduceToFullHD(src, callback) {
  const img = new Image();
  img.onload = () => {
    const MAX_W = 1920, MAX_H = 1080;
    const scale = Math.min(1, MAX_W / img.naturalWidth, MAX_H / img.naturalHeight);
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = () => alert('No se pudo leer la imagen seleccionada');
  img.src = src;
}

function addPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const cat = event.target.dataset.cat;
    const idx = parseInt(event.target.dataset.idx);
    const ta = document.getElementById(`obs-${cat}-${idx}`);
    if (ta) data.items[cat][idx].observation = ta.value;
    reduceToFullHD(e.target.result, (dataUrl) => {
      data.items[cat][idx].photos.push({
        data: dataUrl,
        name: file.name
      });
      persistState();
      renderCategory(currentCat);
    });
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function getGradientColor(percent) {
  // Rojo (0%) -> Naranja (50%) -> Verde (100%)
  if (percent <= 50) {
    const ratio = percent / 50;
    const r = Math.round(211 - (211 - 255) * ratio);
    const g = Math.round(47 + (152 - 47) * ratio);
    const b = Math.round(47 + (45 - 47) * ratio);
    return `rgb(${r}, ${g}, ${b})`;
  } else {
    const ratio = (percent - 50) / 50;
    const r = Math.round(255 - (255 - 56) * ratio);
    const g = Math.round(152 + (136 - 152) * ratio);
    const b = Math.round(45 + (60 - 45) * ratio);
    return `rgb(${r}, ${g}, ${b})`;
  }
}

function percentToColor(pct) {
  const hue = Math.max(0, Math.min(100, pct)) * 1.2; // 0=red, 100=green(120)
  return `hsl(${hue}, 70%, 42%)`;
}

let activeRec = null;

function startAudioTranscription(btn, textareaId, cat, idx) {
  if (activeRec) { activeRec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Tu navegador no soporta transcripción de voz. Usa Google Chrome o Microsoft Edge.');
    return;
  }
  const rec = new SR();
  rec.lang = 'es-MX';
  rec.continuous = true;
  rec.interimResults = false;

  rec.onresult = (e) => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) text += e.results[i][0].transcript;
    }
    text = text.trim();
    if (!text) return;
    const ta = document.getElementById(textareaId);
    if (!ta) return;
    ta.value = (ta.value.trim() ? ta.value.trimEnd() + ' ' : '') + text;
    updateObs(cat, idx, ta.value);
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      alert('Permiso de micrófono denegado. Permite el acceso al micrófono en el navegador.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      alert('Error de transcripción: ' + e.error);
    }
  };
  rec.onend = () => {
    activeRec = null;
    btn.textContent = '🎤 Transcribir Audio';
  };

  activeRec = rec;
  btn.textContent = '⏹️ Detener';
  rec.start();
}

    return;
  }

  const lineLabel = data.line === 'MX' ? 'Mobile' : 'Consumer Electronics';
  const wb = XLSX.utils.book_new();

  // --- Cálculo por categoría y por vector estratégico ---
  let totalPoints = 0, totalMax = 0;
  const catRows = [];
  const vectorAgg = {};
  VECTOR_ORDER.forEach(v => vectorAgg[v] = { points: 0, max: 0, cats: [] });

  allCategories.forEach(cat => {
    const items = Object.values(data.items[cat]);
    let catPoints = 0, catMax = items.length * 2;
    let counts = { '-1': 0, '0': 0, '1': 0, '2': 0 };
    items.forEach(i => { catPoints += (i.rating || 0); counts[String(i.rating || 0)]++; });
    const pct = catMax > 0 ? Math.round(catPoints / catMax * 100) : 0;
    const vector = mapToVector(cat);
    catRows.push({ cat, vector, pct, total: items.length, counts });
    vectorAgg[vector].points += catPoints;
    vectorAgg[vector].max += catMax;
    vectorAgg[vector].cats.push(cat);
    totalPoints += catPoints;
    totalMax += catMax;
  });

  const finalPct = totalMax > 0 ? Math.round(totalPoints / totalMax * 100) : 0;
  const finalStatus = getStatusMeta(finalPct);

  // --- Hoja 1: Resumen Ejecutivo ---
  const summary = [
    ['INFORME EJECUTIVO DE AUDITORÍA', ''],
    ['', ''],
    ['Centro de Servicio (ASC)', data.asc],
    ['Auditor', data.auditor],
    ['Fecha de Auditoría', data.date],
    ['Línea de Producto', lineLabel],
    ['', ''],
    ['Puntaje General', finalPct + '%'],
    ['Estado General', finalStatus.label],
    ['Puntos de Control Evaluados', totalMax / 2],
    ['', ''],
    ['RESUMEN POR VECTOR ESTRATÉGICO', ''],
    ['Vector Estratégico', 'Categorías Incluidas', 'Puntaje (%)', 'Estado'],
  ];
  VECTOR_ORDER.forEach(v => {
    const agg = vectorAgg[v];
    const pct = agg.max > 0 ? Math.round(agg.points / agg.max * 100) : 0;
    summary.push([v, agg.cats.join(', '), pct + '%', getStatusMeta(pct).label]);
  });

  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  ws1['!cols'] = [{ wch: 28 }, { wch: 55 }, { wch: 14 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'Resumen Ejecutivo');

  // --- Hoja 2: Categorías ---
  const catSheet = [
    ['Categoría', 'Vector Estratégico', 'Puntaje (%)', 'Controles Evaluados', 'Afecta (-1)', 'No Cumple (0)', 'Parcial (1)', 'Cumple (2)', 'Estado'],
  ];
  catRows.forEach(r => {
    catSheet.push([r.cat, r.vector, r.pct, r.total, r.counts['-1'], r.counts['0'], r.counts['1'], r.counts['2'], getStatusMeta(r.pct).label]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(catSheet);
  ws2['!cols'] = [{ wch: 32 }, { wch: 24 }, { wch: 12 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Categorías');

  // --- Hoja 3: Hallazgos Críticos ---
  const critical = [];
  allCategories.forEach(cat => {
    Object.values(data.items[cat]).forEach(item => {
      if (item.critical || item.rating === -1 || item.rating === 0 || item.rating === 1) {
        critical.push([item.control.code, cat, mapToVector(cat), item.control.question, ratingLabelOf(item.rating), item.observation || '']);
      }
    });
  });
  const critSheet = [['Código', 'Categoría', 'Vector Estratégico', 'Control', 'Evaluación', 'Observación']];
  critSheet.push(...critical);
  const ws3 = XLSX.utils.aoa_to_sheet(critSheet);
  ws3['!cols'] = [{ wch: 10 }, { wch: 26 }, { wch: 22 }, { wch: 55 }, { wch: 14 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws3, 'Hallazgos Críticos');

  // --- Hoja 4: Detalle Completo ---
  const detail = [['Código', 'Categoría', 'Vector Estratégico', 'Control', 'Evaluación', 'Puntos', 'Marcado Crítico', 'Observación']];
  allCategories.forEach(cat => {
    Object.values(data.items[cat]).forEach(item => {
      detail.push([item.control.code, cat, mapToVector(cat), item.control.question, ratingLabelOf(item.rating), item.rating ?? 0, item.critical ? 'Sí' : 'No', item.observation || '']);
    });
  });
  const ws4 = XLSX.utils.aoa_to_sheet(detail);
  ws4['!cols'] = [{ wch: 10 }, { wch: 26 }, { wch: 22 }, { wch: 55 }, { wch: 14 }, { wch: 9 }, { wch: 14 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws4, 'Detalle Completo');

  // --- Hoja 5: Evidencias ---
  const evidences = [['Código de Control', 'Categoría', 'Control', 'Observación', 'Ruta de Evidencia (Foto)']];
  allCategories.forEach(cat => {
    Object.values(data.items[cat]).forEach(item => {
      if (item.photos && item.photos.length > 0) {
        item.photos.forEach((photo, idx) => {
          const fileName = photo.name || `Foto_${item.control.code}_${idx + 1}`;
          evidences.push([item.control.code, cat, item.control.question, item.observation || '', fileName]);
        });
      }
    });
  });
  
  if (evidences.length > 1) {
    const ws5 = XLSX.utils.aoa_to_sheet(evidences);
    ws5['!cols'] = [{ wch: 12 }, { wch: 26 }, { wch: 55 }, { wch: 40 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, ws5, 'Evidencias');
  }

  XLSX.writeFile(wb, `Auditoria_${data.asc.replace(/\s+/g, '_')}_${data.date}.xlsx`);
}

function exportPDF() {
  if (typeof html2pdf === 'undefined') {
    alert('Error: librería html2pdf no cargada');
    return;
  }

  const lineLabel = data.line === 'MX' ? 'Mobile' : 'Consumer Electronics';

  let totalPoints = 0, maxPoints = 0;
  const catRows = [];
  const vectorAgg = {};
  VECTOR_ORDER.forEach(v => vectorAgg[v] = { points: 0, max: 0, cats: [] });

  allCategories.forEach(cat => {
    const items = Object.values(data.items[cat]);
    let catPoints = 0, catMax = items.length * 2;
    let counts = {'-1': 0, '0': 0, '1': 0, '2': 0};
    items.forEach(i => {
      catPoints += (i.rating || 0);
      counts[String(i.rating || 0)]++;
    });
    const pct = catMax > 0 ? Math.round(catPoints / catMax * 100) : 0;
    const vector = mapToVector(cat);
    catRows.push({ cat, vector, pct, total: items.length, counts });
    vectorAgg[vector].points += catPoints;
    vectorAgg[vector].max += catMax;
    vectorAgg[vector].cats.push({ cat, pct });
    totalPoints += catPoints;
    maxPoints += catMax;
  });
  const totalControls = allCategories.reduce((a,c)=>a+Object.values(data.items[c]).length,0);
  const finalPct = maxPoints > 0 ? Math.round(totalPoints / maxPoints * 100) : 0;
  const finalStatus = getStatusMeta(finalPct);

  const critical = [];
  allCategories.forEach(cat => {
    Object.entries(data.items[cat]).forEach(([idx, item]) => {
      if (item.critical || item.rating === -1 || item.rating === 0 || item.rating === 1) {
        critical.push({ cat, item });
      }
    });
  });
  critical.sort((a, b) => (a.item.rating || 0) - (b.item.rating || 0));

  const bar = (pct, height) => `
    <div style="flex: 1; height: ${height || 10}px; background: #e9ecf5; border-radius: 6px; overflow: hidden;">
      <div style="width: ${Math.max(pct, 2)}%; height: 100%; background: ${getGradientColor(pct)}; border-radius: 6px;"></div>
    </div>`;

  const kpiCard = (label, value, sub, color) => `
    <div style="flex: 1; background: #fff; border: 1px solid #e3e6ef; border-radius: 10px; padding: 16px 18px;">
      <div style="font-size: 10.5px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">${label}</div>
      <div style="font-size: 28px; font-weight: 800; color: ${color || '#1428A0'}; margin-top: 6px;">${value}</div>
      <div style="font-size: 11px; color: #8a8f9c; margin-top: 4px;">${sub}</div>
    </div>`;

  let html = `
    <div style="font-family: 'Segoe UI', Arial, sans-serif; color: #1a1a2e;">
      <div style="background: #1428A0; padding: 26px 34px; display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div style="color: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 2px;">SAMSUNG</div>
          <div style="color: #aab8f5; font-size: 10.5px; letter-spacing: 1.5px; margin-top: 2px; text-transform: uppercase;">Auditoría de Calidad · Centro de Servicio</div>
          <div style="color: #ffffff; font-size: 21px; font-weight: 800; margin-top: 14px;">Informe Ejecutivo de Auditoría</div>
        </div>
        <div style="text-align: right; color: #ffffff; font-size: 11px; line-height: 1.8; min-width: 180px;">
          <div><span style="color: #aab8f5;">ASC:</span> <b>${data.asc}</b></div>
          <div><span style="color: #aab8f5;">Auditor:</span> <b>${data.auditor}</b></div>
          <div><span style="color: #aab8f5;">Fecha:</span> <b>${data.date}</b></div>
          <div><span style="color: #aab8f5;">Línea:</span> <b>${lineLabel}</b></div>
        </div>
      </div>

      <div style="padding: 24px 34px 8px;">
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
          ${kpiCard('Puntaje General', finalPct + '%', `sobre ${maxPoints} puntos posibles`, getGradientColor(finalPct))}
          ${kpiCard('Estado General', finalStatus.label, 'clasificación consolidada', finalStatus.color)}
          ${kpiCard('Controles Evaluados', totalControls, `en ${allCategories.length} categorías`, '#1428A0')}
          ${kpiCard('Hallazgos Críticos', critical.length, critical.length > 0 ? 'requieren acción' : 'sin pendientes', critical.length > 0 ? '#d32f2f' : '#1a9850')}
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 26px;">
          <div style="font-size: 11px; color: #6b7280; white-space: nowrap;">Cumplimiento global</div>
          ${bar(finalPct, 14)}
          <div style="font-size: 12px; font-weight: 700; color: ${getGradientColor(finalPct)}; white-space: nowrap;">${finalPct}%</div>
        </div>

        <div style="font-size: 15px; font-weight: 800; color: #1428A0; margin-bottom: 4px;">Vectores Estratégicos</div>
        <div style="font-size: 11px; color: #6b7280; margin-bottom: 12px;">Los ${totalControls} puntos de control se agrupan en 4 vectores que explican la causa y el impacto operativo del resultado.</div>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px;">
          ${VECTOR_ORDER.map(v => {
            const agg = vectorAgg[v];
            const pct = agg.max > 0 ? Math.round(agg.points / agg.max * 100) : 0;
            const st = getStatusMeta(pct);
            const meta = VECTOR_META[v];
            return `
            <div style="border: 1px solid #e3e6ef; border-radius: 10px; padding: 14px 16px;">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                <div style="font-size: 13px; font-weight: 700; color: #1a1a2e;">${v}</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 10px; font-weight: 700; color: ${st.color}; background: ${st.color}1a; padding: 2px 8px; border-radius: 10px;">${st.label}</span>
                  <span style="font-size: 14px; font-weight: 800; color: ${getGradientColor(pct)};">${pct}%</span>
                </div>
              </div>
              <div style="margin-bottom: 8px;">${bar(pct, 8)}</div>
              <div style="font-size: 10.5px; color: #6b7280; line-height: 1.5;"><b style="color:#4b5066;">Qué mide:</b> ${meta.causa}</div>
              <div style="font-size: 10.5px; color: #6b7280; line-height: 1.5; margin-top: 3px;"><b style="color:#4b5066;">Impacto si falla:</b> ${meta.impacto}</div>
            </div>`;
          }).join('')}
        </div>

        <div style="font-size: 15px; font-weight: 800; color: #1428A0; margin-bottom: 10px;">Puntajes por Categoría</div>
        <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 26px;">
          <tr style="background: #f0f2fa;">
            <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700;">Categoría</th>
            <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700;">Vector</th>
            <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700; width: 130px;">Cumplimiento</th>
            <th style="padding: 8px; text-align: center; color: #4b5066; font-weight: 700;">Estado</th>
          </tr>
          ${catRows.map(r => {
            const st = getStatusMeta(r.pct);
            return `
          <tr style="border-bottom: 1px solid #eef0f6;">
            <td style="padding: 8px;">${r.cat}</td>
            <td style="padding: 8px; color: #6b7280;">${r.vector}</td>
            <td style="padding: 8px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                ${bar(r.pct, 8)}
                <span style="font-weight: 700; color: ${getGradientColor(r.pct)}; width: 32px; text-align: right;">${r.pct}%</span>
              </div>
            </td>
            <td style="padding: 8px; text-align: center;"><span style="font-size: 10px; font-weight: 700; color: ${st.color}; background: ${st.color}1a; padding: 2px 8px; border-radius: 10px;">${st.label}</span></td>
          </tr>`;
          }).join('')}
        </table>

        <div style="font-size: 15px; font-weight: 800; color: #1428A0; margin-bottom: 10px;">Hallazgos Críticos</div>`;

  if (critical.length > 0) {
    html += `<table style="width: 100%; border-collapse: collapse; font-size: 10.5px; margin-bottom: 20px;">
      <tr style="background: #f0f2fa;">
        <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700;">Código</th>
        <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700;">Control</th>
        <th style="padding: 8px; text-align: center; color: #4b5066; font-weight: 700;">Evaluación</th>
        <th style="padding: 8px; text-align: left; color: #4b5066; font-weight: 700;">Observación</th>
      </tr>
      ${critical.map(c => {
        const r = c.item.rating;
        const sevColor = (r === -1 || r === 0) ? '#d32f2f' : '#e07a1f';
        const sevBg = (r === -1 || r === 0) ? '#fdeeee' : '#fdf3e9';
        return `
      <tr style="background: ${sevBg}; border-bottom: 3px solid #fff;">
        <td style="padding: 8px; font-weight: 700; border-left: 3px solid ${sevColor};">${c.item.control.code}</td>
        <td style="padding: 8px;">${c.item.control.question}</td>
        <td style="padding: 8px; text-align: center;"><span style="font-weight: 700; color: ${sevColor};">${ratingLabelOf(r)}</span></td>
        <td style="padding: 8px; color: #4b5066;">${c.item.observation || '—'}</td>
      </tr>`;
      }).join('')}

    html += `<p style="font-size: 12px; color: #6b7280;">Sin hallazgos críticos registrados.</p>`;
  }

  allCategories.forEach(cat => {
    Object.entries(data.items[cat]).forEach(([idx, item]) => {
      if (item.photos && item.photos.length > 0) {
        item.photos.forEach((photoObj, photoIdx) => {
          allEvidences.push({
            code: item.control.code,
            cat: cat,
            question: item.control.question,
            photo: typeof photoObj === 'string' ? photoObj : photoObj.data,
            name: typeof photoObj === 'string' ? '' : (photoObj.name || ''),
            observation: item.observation || ''
          });
        });
      }
    });
  });

  if (allEvidences.length > 0) {
    html += `
        <div style="page-break-before: always; margin-top: 20px; padding-top: 20px; border-top: 2px solid #1428A0;">
          <div style="font-size: 16px; font-weight: 800; color: #1428A0; margin-bottom: 14px;">Evidencias Fotográficas</div>
          <div style="font-size: 11px; color: #6b7280; margin-bottom: 16px;">Registro de fotografías asociadas a los puntos de control evaluados.</div>`;
    
    allEvidences.forEach((ev, idx) => {
      html += `
          <div style="margin-bottom: 16px; border: 1px solid #e3e6ef; border-radius: 8px; padding: 12px; background: #fafbfd;">

          <span>Documento confidencial de uso interno</span>
        </div>
      </div>
    </div>`;

  html2pdf().set({
    margin: 10,
    filename: `Reporte_${data.asc.replace(/\s+/g, '_')}_${data.date}.pdf`,
    html2canvas: { scale: 2 },
    jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
  }).fromString(html).save();
}

  document.getElementById(id).classList.add('active');
}

  }
  if (allControls.length === 0 && window.__EMBEDDED_CONTROLS__) {
